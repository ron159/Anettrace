name: Build CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'skills/anettrace-analysis/**'
      - 'tools/network_report.py'
      - 'tests/test_network_report.py'
      - 'tests/test_analysis_skill.py'
      - 'tests/network_report_*.js'
      - 'schemas/network-performance-v1.schema.json'
      - 'docs/network-performance-report.md'
      - 'docs/analysis-skill.md'
      - 'README.md'
      - 'tasks/**'
      - '.github/workflows/analysis-skill.yml'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'skills/anettrace-analysis/**'
      - 'tools/network_report.py'
      - 'tests/test_network_report.py'
      - 'tests/test_analysis_skill.py'
      - 'tests/network_report_*.js'
      - 'schemas/network-performance-v1.schema.json'
      - 'docs/network-performance-report.md'
      - 'docs/analysis-skill.md'
      - 'README.md'
      - 'tasks/**'
      - '.github/workflows/analysis-skill.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang gcc libbpf-dev libelf-dev libzstd-dev llvm make \
            pkg-config python3 python3-venv python3-yaml zlib1g-dev
      - name: Build Linux dual-backend binary
        run: make all
      - name: Check CLI contracts
        run: |
          version="$(cat VERSION)"
          ./src/anettrace --version | grep -q "Anettrace ${version}"
          ./src/anettrace --version | grep -q "commit ${GITHUB_SHA}"
          ./src/anettrace -h | grep -q -- '--uid'
          ./src/anettrace -h | grep -q -- '--traffic'
          ./src/anettrace -h | grep -q -- '--interval'
          ./src/anettrace -h | grep -q -- '--perfetto-events'
          ./src/anettrace -h | grep -q -- '--capture-trace'
          ./src/anettrace -h | grep -q -- '--ring-buffer'
          ./src/anettrace -h | grep -q -- '--trace-detail'
          ./src/anettrace -h | grep -q -- '--connect-diagnostics'
          ./src/anettrace -h | grep -q -- '--trace-profile'
          ./src/anettrace -h | grep -q -- '--perfetto-config'
          ./src/anettrace -h | grep -q -- '--duration'
          ./src/anettrace -h | grep -q -- '--output'
          ./src/anettrace -h > /tmp/anettrace-help.txt
          grep -q '^Packet and owner filters:$' /tmp/anettrace-help.txt
          grep -q '^Analysis modes:$' /tmp/anettrace-help.txt
          grep -q '^Trace capture and export:$' /tmp/anettrace-help.txt
          grep -q '^Event display:$' /tmp/anettrace-help.txt
          grep -q '^Advanced trace controls:$' /tmp/anettrace-help.txt
          grep -q '^Diagnostics and general:$' /tmp/anettrace-help.txt
          if ./src/anettrace --capture-trace --trace-profile invalid \
            > /tmp/trace-profile-invalid.txt 2>&1; then
            exit 1
          fi
          grep -q -- '--trace-profile must be full or sched' \
            /tmp/trace-profile-invalid.txt
          if ./src/anettrace --perfetto-config /tmp/perfetto.pbtxt \
            > /tmp/perfetto-config-invalid.txt 2>&1; then
            exit 1
          fi
          grep -q -- '--perfetto-config requires --capture-trace' \
            /tmp/perfetto-config-invalid.txt
          if ./src/anettrace --capture-trace \
            --perfetto-config /tmp/perfetto.pbtxt --trace-profile full \
            > /tmp/perfetto-config-profile.txt 2>&1; then
            exit 1
          fi
          grep -q -- '--perfetto-config and --trace-profile are mutually exclusive' \
            /tmp/perfetto-config-profile.txt
          if ./src/anettrace --capture-trace \
            --perfetto-config /tmp/anettrace-config-does-not-exist.pbtxt \
            > /tmp/perfetto-config-missing.txt 2>&1; then
            exit 1
          fi
          grep -q -- 'cannot read Perfetto config' \
            /tmp/perfetto-config-missing.txt
          if ./src/anettrace --trace-detail > /tmp/trace-detail-invalid.txt 2>&1; then
            exit 1
          fi
          grep -q -- '--trace-detail requires --capture-trace or --perfetto-events' \
            /tmp/trace-detail-invalid.txt
          if ./src/anettrace --ring-buffer > /tmp/ring-buffer-invalid.txt 2>&1; then
            exit 1
          fi
          grep -q -- '--ring-buffer requires --capture-trace' \
            /tmp/ring-buffer-invalid.txt
          if ./src/anettrace --traffic --capture-trace \
            --trace-profile invalid > /tmp/traffic-trace-combined.txt 2>&1; then
            exit 1
          fi
          grep -q -- '--trace-profile must be full or sched' \
            /tmp/traffic-trace-combined.txt
          if grep -q -- '--traffic is standalone' /tmp/traffic-trace-combined.txt; then
            exit 1
          fi
          if ./src/anettrace --traffic --perfetto-events /tmp/events.jsonl \
            > /tmp/traffic-perfetto-conflict.txt 2>&1; then
            exit 1
          fi
          grep -q -- '--traffic cannot be combined with --perfetto-events' \
            /tmp/traffic-perfetto-conflict.txt
          if ./src/anettrace --capture-trace --trace tcp \
            > /tmp/capture-trace-conflict.txt 2>&1; then
            exit 1
          fi
          grep -q -- '--capture-trace and --trace are standalone' \
            /tmp/capture-trace-conflict.txt
          if ./src/anettrace --date --timestamp > /tmp/conflict.txt 2>&1; then
            exit 1
          fi
          grep -q -- '--date and --timestamp cannot be used together' \
            /tmp/conflict.txt
          if ./src/anettrace --traffic --proto icmp -c 1 \
            > /tmp/traffic-proto.txt 2>&1; then
            exit 1
          fi
          grep -q -- '--traffic supports only --proto tcp or --proto udp' \
            /tmp/traffic-proto.txt
      - name: Check opt-in traffic UI CLI
        run: python3 tests/traffic_cli_contracts.py ./src/anettrace
      - name: Check packet-flow options
        run: python3 tests/packet_flow_cli_contracts.py ./src/anettrace
      - name: Run source contract checks
        run: ./tests/source-contracts.sh
      - name: Test traffic accounting and terminal presentation
        run: |
          python3 -m unittest \
            tests/test_traffic_accounting.py \
            tests/test_traffic_display.py \
            tests/test_traffic_history.py \
            tests/test_traffic_samples.py
      - name: Verify live traffic terminal controls and totals
        run: sudo python3 tests/traffic_ui_integration.py ./src/anettrace
      - name: Verify UDP endpoints and payload counters on the running kernel
        run: |
          sudo python3 tests/traffic_udp_integration.py ./src/anettrace
          sudo python3 tests/traffic_udp_integration.py ./src/anettrace --protocol all
      - name: Verify ordinary UDP trace and application I/O association
        run: |
          sudo python3 tests/udp_trace_integration.py ./src/anettrace
          sudo python3 tests/udp_trace_integration.py ./src/anettrace --trace-tags

      - name: Verify observed wake-to-run context on the running kernel
        run: |
          python3 -m unittest tests/test_wakeup_integration_validation.py
          sudo python3 tests/wakeup_trace_integration.py ./src/anettrace

      - name: Verify early RX context and target isolation on the running kernel
        run: sudo python3 tests/rx_context_integration.py ./src/anettrace

      - name: Verify TCP and UDP send markers with protocol trace groups
        run: sudo python3 tests/send_packet_integration.py ./src/anettrace
      - name: Verify ICMP and ICMPv6 packet send and receive events
        run: sudo python3 tests/icmp_trace_integration.py ./src/anettrace
      - name: Run timezone offset tests
        run: |
          gcc -O2 -Wall -Wextra -Iutils \
            tests/timezone_offset_test.c utils/time_utils.c \
            -o /tmp/timezone-offset-test
          /tmp/timezone-offset-test
      - name: Run Perfetto ring-window trim tests
        run: |
          gcc -O2 -Wall -Wextra -Werror -Isrc \
            tests/perfetto_trim_test.c src/perfetto_trim.c \
            -o /tmp/perfetto-trim-test
          /tmp/perfetto-trim-test
      - name: Run custom Perfetto config tests
        run: |
          gcc -O2 -Wall -Wextra -Werror -Isrc \
            tests/perfetto_config_test.c src/perfetto_config.c \
            -o /tmp/perfetto-config-test
          /tmp/perfetto-config-test
      - name: Run capture orchestrator tests
        run: |
          python3 -m unittest \
            tests/test_capture_android_trace.py \
            tests/test_connect_diagnostics.py \
            tests/test_diagnose_android_connect.py \
            tests/test_validate_android_connect.py \
            tests/test_soak_android_connect.py \
            tests/test_release_assets.py
      - name: Run unprivileged system-only capture tests
        env:
          ANETTRACE_TEST_BIN: ${{ github.workspace }}/src/anettrace
        run: python3 -m unittest tests/test_system_trace_only.py
      - name: Run Perfetto conversion contract
        run: |
          python3 -m venv /tmp/perfetto-venv
          /tmp/perfetto-venv/bin/pip install -r tools/requirements-perfetto.txt
          /tmp/perfetto-venv/bin/python -m unittest \
            tests/test_perfetto_converter.py \
            tests/test_perfetto_graph.py \
            tests/test_socket_overview_native.py \
            tests/test_trace_merge.py \
            tests/test_network_report.py \
            tests/test_connect_diagnostics_schema.py
