name: Build CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          ca-certificates clang gcc git iperf3 iproute2 iptables iputils-ping \
          libelf-dev libzstd-dev llvm make netcat-openbsd \
          pkg-config python3 python3-yaml wget zlib1g-dev
    - name: Install libbpf 1.6.2
      run: |
        wget -q \
          https://github.com/libbpf/libbpf/archive/refs/tags/v1.6.2.tar.gz \
          -O /tmp/libbpf.tar.gz
        mkdir /tmp/libbpf
        tar -xzf /tmp/libbpf.tar.gz -C /tmp/libbpf --strip-components=1
        make -C /tmp/libbpf/src BUILD_SHARED=1 BUILD_STATIC=1
        libbpf_libdir="/usr/lib/$(gcc -dumpmachine)"
        sudo make -C /tmp/libbpf/src install \
          PREFIX=/usr LIBDIR="${libbpf_libdir}"
        sudo ldconfig
        test "$(PKG_CONFIG_PATH="${libbpf_libdir}/pkgconfig" \
          pkg-config --modversion libbpf)" = "1.6.2"

        git clone --branch v7.6.0 --depth 1 \
          --recurse-submodules --shallow-submodules \
          https://github.com/libbpf/bpftool.git /tmp/bpftool
        make -C /tmp/bpftool/src -j2
        /tmp/bpftool/src/bpftool version
    - name: Build Linux BTF binary
      run: make BPFTOOL=/tmp/bpftool/src/bpftool all
    - name: Run source contract checks
      run: ./tests/source-contracts.sh
    - name: Run timezone offset tests
      run: |
        gcc -O2 -Wall -Wextra -Isrc \
          tests/timezone_offset_test.c src/utils/sys_utils.c \
          -o /tmp/timezone-offset-test
        /tmp/timezone-offset-test
    - name: Run Linux BTF selftests
      run: sudo ./tests/selftests.sh ./src/anettrace
