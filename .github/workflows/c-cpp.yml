name: Build CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang gcc libbpf-dev libelf-dev libzstd-dev llvm make \
            pkg-config python3 python3-venv python3-yaml zlib1g-dev
      - name: Build Linux dual-backend binary
        run: make all
      - name: Check CLI contracts
        run: |
          ./src/anettrace --version | grep -q 'Anettrace 0.4.0'
          ./src/anettrace -h | grep -q -- '--uid'
          ./src/anettrace -h | grep -q -- '--traffic'
          ./src/anettrace -h | grep -q -- '--interval'
          ./src/anettrace -h | grep -q -- '--perfetto-events'
          if ./src/anettrace --date --timestamp > /tmp/conflict.txt 2>&1; then
            exit 1
          fi
          grep -q -- '--date and --timestamp cannot be used together' \
            /tmp/conflict.txt
          if ./src/anettrace --traffic --proto icmp -c 1 \
            > /tmp/traffic-proto.txt 2>&1; then
            exit 1
          fi
          grep -q -- '--traffic supports only --proto tcp or --proto udp' \
            /tmp/traffic-proto.txt
      - name: Run source contract checks
        run: ./tests/source-contracts.sh
      - name: Run timezone offset tests
        run: |
          gcc -O2 -Wall -Wextra -Iutils \
            tests/timezone_offset_test.c utils/time_utils.c \
            -o /tmp/timezone-offset-test
          /tmp/timezone-offset-test
      - name: Run capture orchestrator tests
        run: python3 -m unittest tests/test_capture_android_trace.py
      - name: Run Perfetto conversion contract
        run: |
          python3 -m venv /tmp/perfetto-venv
          /tmp/perfetto-venv/bin/pip install -r tools/requirements-perfetto.txt
          /tmp/perfetto-venv/bin/python -m unittest tests/test_perfetto_converter.py
