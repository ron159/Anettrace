name: Build CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ca-certificates clang gcc libbpf-dev libelf-dev libzstd-dev llvm \
          make pkg-config python3 python3-yaml wget zlib1g-dev
    - name: Install libbpf 1.6.2
      run: |
        wget -q \
          https://github.com/libbpf/libbpf/archive/refs/tags/v1.6.2.tar.gz \
          -O /tmp/libbpf.tar.gz
        mkdir /tmp/libbpf
        tar -xzf /tmp/libbpf.tar.gz -C /tmp/libbpf --strip-components=1
        make -C /tmp/libbpf/src BUILD_SHARED=1 BUILD_STATIC=1
        sudo make -C /tmp/libbpf/src install PREFIX=/usr LIBDIR=/usr/lib
        sudo ldconfig
        test "$(pkg-config --modversion libbpf)" = "1.6.2"
    - name: Build Linux BTF binary
      run: make all
