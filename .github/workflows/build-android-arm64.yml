name: build-android-arm64-anettrace

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # 手动触发
  workflow_dispatch:

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 可选：显式注册 QEMU，确保能运行 arm64 容器
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Build anettrace (Android arm64 / BTF)
        run: |
          docker run --rm --privileged --platform=linux/arm64 \
            -v "$PWD":/work \
            -w /work \
            ubuntu:22.04 \
            /bin/bash -euxc '
              # 1. 基础依赖（不装 linux-headers / linux-tools）
              apt update
              DEBIAN_FRONTEND=noninteractive apt install -y \
                python3 python3-yaml \
                clang llvm gcc make \
                libelf-dev pkg-config \
                wget git file ca-certificates

              # 2. 从源码安装较新的 libbpf
              cd /tmp
              wget https://github.com/libbpf/libbpf/archive/refs/tags/v1.6.2.tar.gz
              tar -xf v1.6.2.tar.gz
              cd libbpf-v1.6.2/src
              make BUILD_SHARED=1 BUILD_STATIC=1
              make install PREFIX=/usr LIBDIR=/usr/lib
              ldconfig

              # 3. 覆盖 linux/bpf.h 头文件（使用 6.12 的版本）
              cd /tmp
              wget https://raw.githubusercontent.com/torvalds/linux/v6.12/tools/include/uapi/linux/bpf.h
              mkdir -p /work/shared/bpf/linux
              cp bpf.h /work/shared/bpf/linux/

              # 4. 编译 BTF/CO-RE 版 anettrace
              cd /work
              make clean
              make all
              make pack
            '

      - name: Upload packed artifact
        uses: actions/upload-artifact@v4
        with:
          name: anettrace-android-arm64
          path: |
            output/anettrace-*.tar.bz2
            src/anettrace
          if-no-files-found: error
