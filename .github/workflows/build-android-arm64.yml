name: Build Android arm64 tracing

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up arm64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Build static arm64 artifact
        run: |
          docker run --rm --platform=linux/arm64 \
            -e GITHUB_SHA \
            -v "$PWD:/work" \
            -w /work \
            ubuntu:22.04 \
            /bin/bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                binutils bzip2 ca-certificates clang file gcc git \
                libelf-dev libzstd-dev llvm make pkg-config python3 \
                python3-yaml wget zlib1g-dev

              cd /tmp
              wget -q \
                https://github.com/libbpf/libbpf/archive/refs/tags/v1.6.2.tar.gz \
                -O libbpf.tar.gz
              mkdir libbpf
              tar -xzf libbpf.tar.gz -C libbpf --strip-components=1
              make -C libbpf/src BUILD_SHARED=1 BUILD_STATIC=1
              libbpf_libdir="/usr/lib/$(gcc -dumpmachine)"
              make -C libbpf/src install \
                PREFIX=/usr LIBDIR="${libbpf_libdir}"
              ldconfig
              test "$(PKG_CONFIG_PATH="${libbpf_libdir}/pkgconfig" \
                pkg-config --modversion libbpf)" = "1.6.2"

              git clone --branch v7.6.0 --depth 1 \
                --recurse-submodules --shallow-submodules \
                https://github.com/libbpf/bpftool.git bpftool
              make -C bpftool/src -j2
              bpftool/src/bpftool version

              cd /work
              make clean
              make BPFTOOL=/tmp/bpftool/src/bpftool \
                STATIC=1 TARGET_PLATFORM=android-arm64 all
              make BPFTOOL=/tmp/bpftool/src/bpftool \
                STATIC=1 TARGET_PLATFORM=android-arm64 pack

              file src/anettrace | tee output/anettrace.file.txt
              readelf -h src/anettrace > output/anettrace.elf-header.txt
              readelf -l src/anettrace > output/anettrace.program-headers.txt
              readelf -d src/anettrace > output/anettrace.dynamic.txt

              grep -q "Machine:.*AArch64" output/anettrace.elf-header.txt
              ! grep -q INTERP output/anettrace.program-headers.txt
              ! grep -q NEEDED output/anettrace.dynamic.txt

              src/anettrace --version
              src/anettrace -h > /tmp/anettrace-help.txt
              grep -q -- "--uid" /tmp/anettrace-help.txt
              grep -q -- "--timestamp" /tmp/anettrace-help.txt
              grep -q -- "--id" /tmp/anettrace-help.txt
              grep -q -- "--mark" /tmp/anettrace-help.txt
              if src/anettrace --date --timestamp \
                > /tmp/anettrace-conflict.txt 2>&1; then
                exit 1
              fi
              grep -q -- "--date and --timestamp cannot be used together" \
                /tmp/anettrace-conflict.txt

              archive=output/anettrace-0.4.0-android-arm64-tracing.tar.bz2
              test -f "${archive}"
              sha256sum "${archive}" > "${archive}.sha256"
              sha256sum src/anettrace "${archive}" \
                > output/SHA256SUMS
              {
                echo "source_commit=${GITHUB_SHA}"
                echo "upstream_btf_commit=d455f001315322db4d606a8bdf8c659ba36b269c"
                echo "libbpf_version=1.6.2"
                echo "target=android-arm64-tracing"
                gcc --version | head -1
                clang --version | head -1
              } > output/build-metadata.txt
            '

      - name: Upload Android arm64 tracing artifact
        uses: actions/upload-artifact@v4
        with:
          name: anettrace-0.4.0-android-arm64-tracing
          if-no-files-found: error
          path: |
            src/anettrace
            output/anettrace-*.tar.bz2
            output/anettrace-*.tar.bz2.sha256
            output/SHA256SUMS
            output/build-metadata.txt
            output/anettrace.*.txt

      - name: Download uploaded artifact
        uses: actions/download-artifact@v4
        with:
          name: anettrace-0.4.0-android-arm64-tracing
          path: downloaded

      - name: Verify downloaded artifact
        run: |
          cd downloaded
          archive=output/anettrace-0.4.0-android-arm64-tracing.tar.bz2
          sha256sum --check output/SHA256SUMS
          sha256sum --check "${archive}.sha256"
          file src/anettrace | grep -q 'ARM aarch64'
          readelf -h src/anettrace | grep -q 'Machine:.*AArch64'
          ! readelf -l src/anettrace | grep -q INTERP
          ! readelf -d src/anettrace | grep -q NEEDED
          tar -tjf "${archive}" | grep -q '^anettrace-0.4.0-android-arm64-tracing/anettrace$'
